name: Build desktop platform

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      NICEGAL_PAT:
        required: false

jobs:
  build-windows:
    if: inputs.platform == 'windows'
    uses: ./.github/workflows/build-platform-windows.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}

  build-linux:
    if: inputs.platform == 'linux'
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}

  build-flatpak:
    needs: build-linux
    if: inputs.platform == 'linux'
    uses: ./.github/workflows/build-flatpak.yml

  build-macos:
    if: inputs.platform == 'macos-arm64'
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ inputs.version }}
      os: macos-latest
      platform: macos-arm64
      arch: arm64
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}
    # Intel stays disabled. Restore its release-notes row and add a separate router job
    # and matrix entry to re-enable it: os: macos-26-intel, platform: macos-intel, arch: x64.
