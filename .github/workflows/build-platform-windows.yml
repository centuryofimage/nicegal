name: Build Windows app

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      NICEGAL_PAT:
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.NICEGAL_PAT || github.token }}
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore static FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: nicegal-server/.deps/ffmpeg
          key: ffmpeg-n9.0.1-windows-${{ hashFiles('.github/ffmpeg/windows-x64.args', '.github/ffmpeg/nasm-windows.patch', '.github/actions/ffmpeg-windows/action.yml') }}-v1

      - name: Prepare static FFmpeg
        uses: ./.github/actions/ffmpeg-windows
        with:
          cache-hit: ${{ steps.ffmpeg-cache.outputs.cache-hit }}

      - name: Locate libclang
        shell: pwsh
        run: |
          $candidates = @(
            "$env:VCINSTALLDIR/Tools/Llvm/x64/bin",
            "$env:ProgramFiles/LLVM/bin"
          )
          $clangDirectory = $candidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'libclang.dll')
          } | Select-Object -First 1
          if (-not $clangDirectory) { throw 'The runner has no libclang.dll for Rust bindgen.' }
          $clangVersion = (Get-Item -LiteralPath (Join-Path $clangDirectory 'libclang.dll')).VersionInfo.ProductVersion
          Write-Host "Using libclang $clangVersion from $clangDirectory"
          "LIBCLANG_PATH=$clangDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Visual C++ runtime
        shell: pwsh
        run: |
          $runtimeDirectory = Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir 'x64') -Directory |
            Where-Object {
              $_.Name -like 'Microsoft.VC*.CRT' -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'vcruntime140.dll')) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'msvcp140.dll'))
            } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $runtimeDirectory) { throw 'The runner has no x64 Visual C++ redistributable directory.' }
          "NICEGAL_CRT_LIB_PATH=$($runtimeDirectory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up desktop build tools
        uses: ./.github/actions/desktop-tools
        with:
          platform: windows

      # Bundles the server, provider libraries, and Visual C++ runtime DLLs.
      - name: Build nicegal-server (DirectML and OpenVINO)
        run: pnpm run build:backend:win

      - name: Stamp the version
        run: npm pkg set version=${{ inputs.version }}

      # Generate update metadata without uploading. The release job owns all assets so clients
      # cannot discover a version before both platform builds and attestations are complete.
      - name: Build and package the app
        env:
          NICEGAL_RELEASE_UPDATES: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          pnpm run build
          pnpm exec electron-builder --win --x64 --publish never

      - name: Verify Windows installer and update artifacts
        shell: pwsh
        run: |
          $prefix = 'dist/nicegal-${{ inputs.version }}-windows-x64'
          $expected = @(
            "$prefix-setup.exe", "$prefix-setup.exe.blockmap",
            "$prefix.zip", 'dist/latest.yml',
            'dist/win-unpacked/resources/app-update.yml',
            'dist/win-unpacked/resources/nicegal-server/nicegal-server.exe'
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf) -or
                (Get-Item -LiteralPath $artifact).Length -eq 0) {
              throw "Missing or empty Windows release artifact: $artifact"
            }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
