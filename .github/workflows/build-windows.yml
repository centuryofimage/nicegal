name: Build desktop apps

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RELEASE_SERIES: "0.0"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  version:
    if: github.repository == 'centuryofimage/nicegal'
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.NICEGAL_PAT || github.token }}
          persist-credentials: false
          # Release numbering reads existing tags, which a shallow clone would not have.
          fetch-depth: 0

      - name: Choose the release version
        id: version
        shell: bash
        run: |
          latest=$(git tag -l "v${RELEASE_SERIES}.*" --sort=-v:refname | sed -n '1p')
          patch=${latest##*.}
          version="${RELEASE_SERIES}.$(( ${patch:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (previous tag: ${latest:-none})"

  build-macos:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
          - os: macos-26-intel
            platform: macos-intel
            arch: x64
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}

  build-windows:
    needs: version
    uses: ./.github/workflows/build-platform-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}

  build-linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}

  attest:
    needs: [build-macos, build-windows, build-linux]
    if: github.repository == 'centuryofimage/nicegal' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Attest downloads
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

      - name: Preserve the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      - name: Upload provenance
        uses: actions/upload-artifact@v7
        with:
          name: packages-provenance
          if-no-files-found: error
          path: dist/provenance.intoto.jsonl

  publish:
    needs: [version, attest]
    if: github.repository == 'centuryofimage/nicegal' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    environment: release
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Build release notes
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          test -s .github/RELEASE_NOTES_TEMPLATE.md
          template="$(<.github/RELEASE_NOTES_TEMPLATE.md)"
          template="${template//\{\{VERSION\}\}/$version}"
          template="${template//\{\{RELEASE_URL\}\}/$base_url}"
          {
            cat CHANGELOG
            printf '\n\n%s\n' "$template"
          } > RELEASE_BODY.md

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "nicegal $version" \
            --latest \
            --notes-file RELEASE_BODY.md \
            dist/*.exe dist/*.zip dist/*.blockmap dist/latest.yml \
            dist/*.AppImage dist/*.deb dist/*.dmg dist/latest-linux.yml dist/*.intoto.jsonl
