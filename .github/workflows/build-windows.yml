name: Build desktop apps

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  RELEASE_SERIES: "0.0"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  version:
    if: github.repository == 'centuryofimage/nicegal'
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.NICEGAL_PAT || github.token }}
          persist-credentials: false
          # Release numbering reads existing tags, which a shallow clone would not have.
          fetch-depth: 0

      - name: Choose the release version
        id: version
        shell: bash
        run: |
          latest=$(git tag -l "v${RELEASE_SERIES}.*" --sort=-v:refname | sed -n '1p')
          patch=${latest##*.}
          version="${RELEASE_SERIES}.$(( ${patch:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (previous tag: ${latest:-none})"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        platform: [windows, linux, macos-arm64]
    uses: ./.github/workflows/build-platform.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: ${{ matrix.platform }}
    secrets:
      NICEGAL_PAT: ${{ secrets.NICEGAL_PAT }}

  attest:
    needs: build
    if: github.repository == 'centuryofimage/nicegal' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Attest downloads
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

      - name: Preserve the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      - name: Upload provenance
        uses: actions/upload-artifact@v7
        with:
          name: packages-provenance
          if-no-files-found: error
          path: dist/provenance.intoto.jsonl

  publish:
    needs: [version, attest]
    if: github.repository == 'centuryofimage/nicegal' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Build release notes
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          test -s .github/RELEASE_NOTES_TEMPLATE.md
          template="$(<.github/RELEASE_NOTES_TEMPLATE.md)"
          template="${template//\{\{VERSION\}\}/$version}"
          template="${template//\{\{RELEASE_URL\}\}/$base_url}"
          {
            cat CHANGELOG
            printf '\n\n%s\n' "$template"
          } > RELEASE_BODY.md

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "nicegal $version" \
            --latest \
            --notes-file RELEASE_BODY.md \
            dist/*.exe dist/*.zip dist/*.blockmap dist/latest.yml \
            dist/*.AppImage dist/*.deb dist/*.dmg dist/latest-linux.yml dist/*.intoto.jsonl
      - uses: actions/checkout@v7
        with:
          repository: centuryofimage/nicegal-flatpak
          ref: gh-pages
          path: flatpak-site
          token: ${{ secrets.NICEGAL_PAT }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repository
          path: dist
      - name: Import and sign the approved release
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$FLATPAK_GPG_PRIVATE_KEY"
          test -n "$FLATPAK_GPG_KEY_ID"
          tar -xf dist/flatpak-repo.tar -C dist
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work --entrypoint dbus-run-session \
            -e FLATPAK_GPG_KEY_ID -e FLATPAK_GPG_PASSPHRASE \
            ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08 -- bash -lc \
            'bash scripts/sign-flatpak-repo.sh dist/flatpak-repo flatpak-site "$FLATPAK_GPG_KEY_ID"'
      - name: Publish repository to Pages
        env:
          GH_TOKEN: ${{ secrets.NICEGAL_PAT }}
        working-directory: flatpak-site
        shell: bash
        run: |
          git config --local user.name bep
          git config --local user.email 169492267+nicegal@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Flatpak for $GITHUB_SHA"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:gh-pages
