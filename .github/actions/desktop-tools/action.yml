name: Set up desktop build tools
description: Set up Rust, uv, Node, pnpm, and the Electron download caches.

inputs:
  platform:
    description: Desktop platform identifier, including macos-intel when applicable.
    required: true

runs:
  using: composite
  steps:
    - name: Read pinned Rust toolchain
      id: rust-toolchain
      shell: bash
      run: |
        channel=$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' nicegal-server/rust-toolchain.toml)
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Cache restore/save probes run at the frontend root, outside this toolchain file.
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

    # The Rust workspace lives in the nicegal-server submodule.
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        rust-src-dir: nicegal-server
        cache-key: ${{ inputs.platform == 'linux' && 'debian-12' || inputs.platform }}-${{ hashFiles('nicegal-server/Cargo.toml', 'nicegal-server/.cargo/config.toml') }}
        # Let Cargo's target-specific configuration supply compiler flags.
        rustflags: ""
        # FFmpeg's bindgen build script formats its generated bindings.
        components: rustfmt

    # Backend build scripts use uv for the provider-specific ONNX Runtime environment.
    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Electron's install script uses @electron/get, whose cache is separate from
    # electron-builder's cache for packaging tools such as NSIS and 7zip.
    - name: Restore Electron download caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: electron-${{ inputs.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          electron-${{ inputs.platform }}-
        path: |
          ${{ runner.os == 'Windows' && '~\AppData\Local\electron\Cache' || runner.os == 'macOS' && '~/Library/Caches/electron' || '~/.cache/electron' }}
          ${{ runner.os == 'Windows' && '~\AppData\Local\electron-builder\Cache' || runner.os == 'macOS' && '~/Library/Caches/electron-builder' || '~/.cache/electron-builder' }}

    - shell: bash
      run: |
        jq -r '"PNPM_VERSION=\(.packageManager | split("@")[1])"' < package.json >> "$GITHUB_ENV"

    - name: Setup pnpm
      if: inputs.platform != 'macos-intel'
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        version: ${{ env.PNPM_VERSION }}
        cache: true

    # pnpm/setup currently fails on Intel macOS runners.
    - name: Setup pnpm on Intel macOS
      if: inputs.platform == 'macos-intel'
      shell: bash
      run: |
        npm install -g pnpm@$PNPM_VERSION
        echo "PATH=$HOME/.local/share/pnpm:$PATH" >> "$GITHUB_ENV"
        pnpm ci
