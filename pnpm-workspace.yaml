allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
minimumReleaseAgeExclude:
  - "@types/node@22.20.3"
  - electron@44.4.0 || 44.4.4 || 44.5.1 || 45.1.0
  - "@lucide/svelte@1.52.0 || 1.55.0 || 1.63.0"
  - "@inlang/paraglide-js@2.29.2 || 2.29.3"
  - app-builder-lib@27.0.0-alpha.13
  - builder-util-runtime@10.0.0-alpha.12
  - builder-util@27.0.0-alpha.13
  - dmg-builder@27.0.0-alpha.13
  - electron-builder-squirrel-windows@27.0.0-alpha.13
  - electron-builder@27.0.0-alpha.13
  - electron-publish@27.0.0-alpha.13
  - electron-updater@7.0.0-alpha.12
  - svelte@5.57.3
overrides:
  # selfsigned's @peculiar/x509 needs the same asn1-schema copy as its asn1-* siblings; two
  # copies keep separate schema registries and certificate generation fails.
  "@peculiar/asn1-schema": ^2.9.5
