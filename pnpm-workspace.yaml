allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
minimumReleaseAgeExclude:
  - "@types/node@22.20.3"
  - electron@44.4.0 || 44.4.4 || 44.5.1 || 45.1.0 || 45.3.1
  - "@lucide/svelte@1.52.0 || 1.55.0 || 1.63.0 || 1.72.0 || 1.78.0"
  - "@inlang/paraglide-js@2.29.2 || 2.29.3"
  - app-builder-lib@27.0.0-alpha.13
  - builder-util-runtime@10.0.0-alpha.12
  - builder-util@27.0.0-alpha.13
  - dmg-builder@27.0.0-alpha.13
  - electron-builder-squirrel-windows@27.0.0-alpha.13
  - electron-builder@27.0.0-alpha.13
  - electron-publish@27.0.0-alpha.13
  - electron-updater@7.0.0-alpha.12
  - svelte@5.57.3
  - "@oxfmt/binding-android-arm-eabi@0.80.0"
  - "@oxfmt/binding-android-arm64@0.80.0"
  - "@oxfmt/binding-darwin-arm64@0.80.0"
  - "@oxfmt/binding-darwin-x64@0.80.0"
  - "@oxfmt/binding-freebsd-x64@0.80.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.80.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.80.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.80.0"
  - "@oxfmt/binding-linux-arm64-musl@0.80.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.80.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.80.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.80.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.80.0"
  - "@oxfmt/binding-linux-x64-gnu@0.80.0"
  - "@oxfmt/binding-linux-x64-musl@0.80.0"
  - "@oxfmt/binding-openharmony-arm64@0.80.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.80.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.80.0"
  - "@oxfmt/binding-win32-x64-msvc@0.80.0"
  - "@sveltejs/vite-plugin-svelte@7.3.2"
  - oxfmt@0.80.0
overrides:
  # selfsigned's @peculiar/x509 needs the same asn1-schema copy as its asn1-* siblings; two
  # copies keep separate schema registries and certificate generation fails.
  "@peculiar/asn1-schema": ^2.9.5
