app-id: io.github.centuryofimage.nicegal
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: nicegal
separate-locales: false
build-options:
  no-debuginfo: true
  strip: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  # Gallery sources are read-only. Other locations are granted by the file chooser
  # portal (including removable drives); do not grant host/home write access.
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
modules:
  - name: nicegal
    buildsystem: simple
    build-commands:
      - mkdir -p /app/nicegal
      - cp -a linux-unpacked/. /app/nicegal/
      - install -Dm755 nicegal.sh /app/bin/nicegal
      - install -Dm644 io.github.centuryofimage.nicegal.desktop /app/share/applications/io.github.centuryofimage.nicegal.desktop
      - install -Dm644 io.github.centuryofimage.nicegal.metainfo.xml /app/share/metainfo/io.github.centuryofimage.nicegal.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.centuryofimage.nicegal.png
    sources:
      - type: dir
        path: ../../dist/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: nicegal.sh
      - type: file
        path: ../../dist/io.github.centuryofimage.nicegal.desktop
      - type: file
        path: io.github.centuryofimage.nicegal.metainfo.xml
      - type: file
        path: ../../build/icon-flatpak.png
        dest-filename: icon.png
